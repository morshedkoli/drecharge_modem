plugins {
    id 'com.android.application'
}

def quoteBuildConfigValue = { value ->
    def safe = (value ?: "").toString()
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
    return "\"${safe}\""
}

def resolveSecret = { propertyName, envName, fallback ->
    return quoteBuildConfigValue(
            project.findProperty(propertyName)
                    ?: System.getenv(envName)
                    ?: fallback
    )
}

// Load keystore properties if available
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.dRecharge.modem'
    compileSdk 34

    defaultConfig {
        applicationId "com.dRecharge.modem"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "D_N", resolveSecret("drecharge.domainToken", "DRECHARGE_DOMAIN_TOKEN", "8qZ2BSujg7ifS2ZiVz2xS03rNVf0ak8B")
        buildConfigField "String", "KEY", resolveSecret("drecharge.cryptoKey", "DRECHARGE_CRYPTO_KEY", "USSD_TUNNEL")
        buildConfigField "String", "IV", resolveSecret("drecharge.cryptoIv", "DRECHARGE_CRYPTO_IV", "abcdefgh")
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'] ?: '../dRecharge.jks')
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // Fallback to environment variables or default values
                storeFile file('../dRecharge.jks')
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
        dataBinding true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Encrypted SharedPreferences (for SIM PINs)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // OkHttp with timeouts
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // Lottie Animation
    implementation 'com.airbnb.android:lottie:6.4.0'
    
    // SplashScreen API (Android 12+ with backward compatibility)
    implementation 'androidx.core:core-splashscreen:1.0.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
